<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Home TV</title>

<link href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Product Sans',sans-serif;
}

body{
    background:#0b0b0d;
    color:white;
    overflow-x:hidden;
}

/* GRID MODE */
body.grid .apps-row{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:25px;
}

body.grid .app{
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* TOP BANNER */
.top-banner{
    width:100%;
    height:260px;
    background:url('https://i.postimg.cc/2yMTv4dF/IMG-3425.jpg');
    background-size:cover;
    background-position:center;
    position:relative;
}

.top-banner::after{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(11,11,13,1));
}

.top-ui{
    position:absolute;
    top:25px;
    left:25px;
    z-index:2;
}

.time{
    font-size:48px;
    font-weight:700;
}

/* QUOTE WIDGET */
.quote-widget{
    position:absolute;
    bottom:25px;
    left:30px;
    right:30px;
    z-index:2;
    font-size:20px;
    color:white;
    opacity:0.9;
    transition:opacity 1s ease, transform 1s ease;
}

.quote-fade-out{
    opacity:0;
    transform:translateY(10px);
}

.quote-fade-in{
    opacity:1;
    transform:translateY(0);
}

/* SEARCH */
.search-wrapper{
    padding:20px 30px;
}

.search-container{
    background:#1f1f22;
    border-radius:999px;
    display:flex;
    align-items:center;
    padding:16px 20px;
}

.search-container input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:white;
    font-size:16px;
}

.search-container button{
    border:none;
    background:#4285f4;
    color:white;
    padding:10px 18px;
    border-radius:999px;
    cursor:pointer;
}

/* SECTIONS */
.section{
    padding:0 30px 45px;
}

.section-title{
    font-size:24px;
    margin-bottom:18px;
    font-weight:700;
}

.apps-row{
    display:flex;
    gap:20px;
    overflow-x:auto;
}

/* APP */
.app{
    text-decoration:none;
    color:white;
    min-width:120px;
}

.app-icon{
    width:110px;
    height:110px;
    border-radius:28px;
    background:#1d1f24;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:10px;
}

.app-icon img{
    width:60%;
    height:60%;
    object-fit:contain;
}

.app-name{
    text-align:center;
    font-size:15px;
}

/* TOGGLE */
.toggle{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#1a1b1f;
    padding:12px 14px;
    border-radius:12px;
    font-size:14px;
}

</style>
</head>

<input type="checkbox" onchange="toggleGrid(this)">
Grid View

<script>

function handleSearch(e){
    e.preventDefault();

    let input = document.getElementById("searchInput").value.trim();
    if(!input) return;

    const isURL = input.includes(".") || input.startsWith("http");

    if(isURL){
        if(!input.startsWith("http")){
            input = "https://" + input;
        }
        window.open(input,"_blank");
    } else {
        window.open("https://www.google.com/search?q=" + encodeURIComponent(input), "_blank");
    }
}

function toggleGrid(el){
    document.body.classList.toggle("grid", el.checked);
}

/* CLOCK */
function updateClock(){
    const now = new Date();
    let h = now.getHours();
    let m = now.getMinutes();
    let s = now.getSeconds();

    const ampm = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;

    document.getElementById("clock").innerText =
    `${h}:${m}:${s} ${ampm}`;
}

/* QUOTES */
const quotes = [
    "Technology connects everything.",
    "Good design disappears into the experience.",
    "Simple systems last longer.",
    "Build for clarity, not complexity.",
    "Interfaces should feel natural.",
    "Less friction, more flow."
];

let qIndex = 0;

function changeQuote(){
    const el = document.getElementById("quoteText");

    el.classList.add("quote-fade-out");

    setTimeout(() => {
        qIndex = (qIndex + 1) % quotes.length;
        el.textContent = quotes[qIndex];

        el.classList.remove("quote-fade-out");
        el.classList.add("quote-fade-in");
    }, 600);

    setTimeout(() => {
        el.classList.remove("quote-fade-in");
    }, 1200);
}

document.getElementById("quoteText").textContent = quotes[0];

setInterval(changeQuote, 10000);

setInterval(updateClock,1000);
updateClock();

</script>
